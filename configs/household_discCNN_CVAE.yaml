seed: 12345

logging_params:
  log_dir: "logs/household_project"
  name: "household_discCNN_CVAE"
  version_name: null

# ======================================================================
# DATA PATHS
# ======================================================================
schedules_path: "data/caveat_schedules.csv"
attributes_path: "data/caveat_attributes.csv"
synthetic_attributes_path: "data/synthethic_attributes.csv"

# ======================================================================
# DATALOADER
# ======================================================================
loader_params:
  train_batch_size: 300
  val_batch_size: 300
  num_workers: 6
  persistent_workers: true
  pin_memory: true
  prefetch_factor: 2
performance_params:
  matmul_precision: "medium"
  allow_tf32: true
  cudnn_benchmark: true
  cudnn_deterministic: false
# ======================================================================
# ENCODER
# ======================================================================
encoder_params:
  name: "household"  # Uses standard household encoder (no interactions needed)
  time_steps: 144
  attributes_path: "data/caveat_attributes.csv"
  dataset_params:
    max_members: 5
    group_by: "hid"
    discretize_age: true
    age_bins: [5, 11, 15, 18, 30, 40, 50, 60, 70]
    label_cols:
      - 'age'
      - 'sex'
      - 'employed'
      - 'studies'
      - 'household_size'
      - 'number_of_vehicles'
      - 'urban_type'


checkpoint_params:
  mode: "train"  # use "ckpt" to run from an existing checkpoint
  ckpt: "last"   # last/latest/best or a filename in the checkpoints dir
  ckpt_path: null  # full path to a checkpoint file (overrides ckpt)
  version_name: null  # overrides logging_params.version_name if set
  output_tag: null    # subdir under the version folder for outputs
  run_infer: true
  run_gen: true
  run_eval: true
# ======================================================================
# TRAINING
# ======================================================================
experiment_params:
  LR: 0.001
  weight_decay: 0.0001
  kld_weight: 0.01
  use_activity_weights: true

scheduler_params:
  scheduler_name: "ReduceLROnPlateau"
  mode: "min"
  factor: 0.5
  patience: 5
  min_lr: 0.00001
  verbose: true

trainer_params:
  max_epochs: 200
  accelerator: "gpu"
  devices: 1
  check_val_every_n_epoch: 1
  patience: 50
  precision: "16-mixed"
  log_every_n_steps: 40

model_params:
  name: "household_discCNN_CVAE"

  max_members: 5
  time_steps: 144
  latent_dim: 8

  hidden_size: 512
  num_layers: 5
  kernel_size: 4
  stride: 2
  padding: 1
  dropout: 0.1

  use_replicate_padding: false
  use_circular_padding: true

  # Optional temporal padding (monkey patch)
  use_monkey_patch: false
  monkey_patch_extra_steps: 24
  home_activity_index: 0
  use_coordination: false
  n_coord_blocks: 2
  coord_kernel_size: [3, 1]
  coord_dilation: 1
  use_global_mix: true
  use_local_mix: true

  kld_annealing_type: "cyclical"
  kld_n_cycles: 5
  kld_cycle_ratio: 0.5
  kld_annealing_epochs: 125
  kld_start_weight: 0.0
  kld_max_weight: 0.01

  conditioning_type: "film"
  label_encoder_mode: "sum"
  labels_hidden_size: 64
  conditioning_embed_dim: 16
  conditioning_hidden_size: 64

  encoder_conditioning: true     
  latent_conditioning: true     
  decoder_conditioning: true     


baseline_evaluation:
  enabled: true
  generate_plots: true
  target_activities:
    - "home"
    - "work"
    - "shop"
    - "education"
    - "leisure"
    - "trip"
  joint_trip_evaluation:
    enabled: true
    trip_activity_name: "trip"
    buffer_time_min: 5.0
    buffer_duration_min: 5.0
    generate_plots: true
